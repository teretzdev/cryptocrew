highest_position_task:
  description: >
    Identify the ticker symbol of the asset with the highest value in the private portfolio.
    Use only the provided tools as this information is private and not available on the Internet or in training data.
  expected_output: >
    JSON formatted response such as {"highest_ticker_symbol":"BTC"} or 
    {"highest_ticker_symbol":"No Transaction"} if there are no transactions.

reporting_task:
  description: >
    You will be provided with a ticker symbol.
    Conduct thorough research on the given ticker symbol, focusing on recent and relevant information.
    Review the context and compile a report in markdown format. Use a markdown table with sources and news if possible.
    Do not search for ticker symbols.
  expected_output: >
    A comprehensive report about a ticker symbol in markdown table format.
    Formatted as markdown without '```'.