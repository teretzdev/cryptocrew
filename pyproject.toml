[tool.poetry]
name = "crypto"
version = "0.1.0"
description = "A multi-agent AI system for cryptocurrency analysis and reporting using crewAI."
authors = ["Crypto Crew Team <team@cryptocrew.com>"]

[tool.poetry.dependencies]
python = ">=3.10,<=3.13"
crewai = {extras = ["tools"], version = "^0.28.8"}
load-dotenv = "^0.1.0"
pandas = "^2.2.2"
python-binance = "^1.0.19"
sphinx = "^4.5.0"
mkdocs = "^1.4.2"

[tool.poetry.scripts]
crypto = "crypto.main:run"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"